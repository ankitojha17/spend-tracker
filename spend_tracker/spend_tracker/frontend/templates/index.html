{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spend Tracker</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <div class="container">
        <h1>Spend Tracker</h1>
        <p class="subtitle">Minimal UI to confirm end-to-end functionality — styling is intentionally basic.</p>

        <!-- AUTH -->
        <section id="auth-section" class="card">
            <div class="tabs">
                <button id="tab-login" class="tab active">Login</button>
                <button id="tab-signup" class="tab">Sign up</button>
            </div>

            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <button type="submit">Login</button>
                <p class="hint">Demo account: <code>demo</code> / <code>Demo@1234</code> (run <code>python manage.py seed_demo_data</code> first)</p>
            </form>

            <form id="signup-form" class="hidden">
                <input type="text" id="signup-username" placeholder="Username" required />
                <input type="email" id="signup-email" placeholder="Email" required />
                <input type="password" id="signup-password" placeholder="Password" required />
                <input type="password" id="signup-confirm-password" placeholder="Confirm password" required />
                <button type="submit">Create account</button>
            </form>

            <p id="auth-message" class="message"></p>
        </section>

        <!-- APP (hidden until logged in) -->
        <section id="app-section" class="hidden">
            <div class="top-bar">
                <span id="whoami"></span>
                <button id="logout-btn">Logout</button>
            </div>

            <div class="grid">
                <div class="card">
                    <h2>Add Category</h2>
                    <form id="category-form">
                        <input type="text" id="category-name" placeholder="e.g. Food" required />
                        <button type="submit">Add</button>
                    </form>
                    <p id="category-message" class="message"></p>
                </div>

                <div class="card">
                    <h2>Add Expense</h2>
                    <form id="expense-form">
                        <input type="number" id="expense-amount" placeholder="Amount" min="0.01" step="0.01" required />
                        <select id="expense-category" required></select>
                        <input type="date" id="expense-date" required />
                        <input type="text" id="expense-note" placeholder="Note (optional)" />
                        <button type="submit">Add Expense</button>
                    </form>
                    <p id="expense-message" class="message"></p>
                </div>
            </div>

            <div class="card">
                <h2>Summary</h2>
                <div class="summary-controls">
                    <input type="month" id="summary-month" />
                    <button id="summary-refresh-btn">Refresh</button>
                </div>
                <div id="summary-output">Loading...</div>
            </div>

            <div class="card">
                <h2>Recent Expenses</h2>
                <div class="filter-row">
                    <select id="filter-category"><option value="">All categories</option></select>
                    <input type="date" id="filter-start-date" />
                    <input type="date" id="filter-end-date" />
                    <button id="filter-apply-btn">Filter</button>
                </div>
                <table id="expense-table">
                    <thead>
                        <tr><th>Date</th><th>Category</th><th>Amount</th><th>Note</th></tr>
                    </thead>
                    <tbody id="expense-table-body"></tbody>
                </table>
                <div class="pagination">
                    <button id="prev-page-btn" disabled>&laquo; Prev</button>
                    <span id="page-indicator"></span>
                    <button id="next-page-btn" disabled>Next &raquo;</button>
                </div>
            </div>
        </section>
    </div>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
